<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XAI金融分析平台</title>
    <link rel="stylesheet" href="/static/styles/base.css">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav>
        <ul>
            <li><a href="{{ url_for('views.home') }}" class="{% if request.endpoint == 'views.home' %}active{% endif %}">首页</a></li>
            <li><a href="{{ url_for('views.stock_page') }}" class="{% if request.endpoint == 'views.stock_page' %}active{% endif %}">股票</a></li>
            <li><a href="{{ url_for('views.future_page') }}" class="{% if request.endpoint == 'views.future_page' %}active{% endif %}">期货</a></li>
        </ul>
    </nav>

    <div class="content">
        {% block content %}{% endblock %}
    </div>

    <script src="/static/scripts/base.js"></script>
    <script src="/static/vendor/echarts.min.js"></script>
    <script src="/static/vendor/marked.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
