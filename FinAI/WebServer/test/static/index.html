<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}默认标题{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
        }
        nav {
            background-color: #333;
            color: white;
            padding: 1rem;
            position: sticky;
            top: 0;
        }
        nav ul {
            display: flex;
            list-style: none;
        }
        nav li {
            margin-right: 1rem;
        }
        nav a {
            color: white;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
        }
        nav a:hover {
            background-color: #555;
        }
        nav a.active {
            background-color: #4CAF50;
        }
        .content {
            padding: 2rem;
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li><a href="{{ url_for('views.home') }}" class="{% if request.endpoint == 'views.home' %}active{% endif %}">首页</a></li>
            <li><a href="{{ url_for('views.stock_page') }}" class="{% if request.endpoint == 'views.stock_page' %}active{% endif %}">股票</a></li>
            <li><a href="{{ url_for('views.future_page') }}" class="{% if request.endpoint == 'views.future_page' %}active{% endif %}">期货</a></li>
        </ul>
    </nav>

    <div class="content">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
